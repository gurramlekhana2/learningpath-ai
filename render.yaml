services:
  - type: web
    name: learningpath-ai-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: '["*"]'
